<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Compartilhar Tela</title>
    <style>
        body { font-family: Arial; text-align: center; background: #222; color: white; padding-top: 50px; }
        .btn { padding: 15px 30px; font-size: 18px; cursor: pointer; border: none; border-radius: 5px; margin: 10px; font-weight: bold;}
        .share { background: #4CAF50; color: white; }
        .watch { background: #2196F3; color: white; }
        input { padding: 15px; font-size: 18px; width: 150px; text-align: center; border-radius: 5px; border: none; text-transform: uppercase; }
        video { width: 80%; max-width: 800px; margin-top: 20px; background: black; border: 2px solid #444; display: none; }
        #codigoSala { font-size: 40px; color: yellow; font-weight: bold; letter-spacing: 5px; display: none;}
        .escondido { display: none; }
    </style>
</head>
<body>
    <div id="menu">
        <h1>Compartilhamento de Tela</h1>
        <button class="btn share" onclick="compartilharTela()">Compartilhar minha tela</button>
        <br><br>
        <input type="text" id="inputCodigo" placeholder="CÓDIGO" maxlength="4">
        <button class="btn watch" onclick="assistirTela()">Assistir</button>
    </div>

    <div id="telaCompartilhar" class="escondido">
        <h2>Seu código é: <span id="codigoSala">----</span></h2>
        <video id="videoLocal" autoplay muted></video>
    </div>

    <div id="telaAssistir" class="escondido">
        <h2>Assistindo...</h2>
        <video id="videoRemoto" autoplay></video>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io('http://localhost:3000');
        let peerConnection;
        let streamLocal;
        let codigoAtual = "";

        // Servidor STUN do Google (necessário para os PCs se acharem na rede)
        const configuracao = { 
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] 
        };

        // --- QUEM COMPARTILHA ---
        async function compartilharTela() {
            try {
                streamLocal = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
                document.getElementById('videoLocal').srcObject = streamLocal;
                document.getElementById('videoLocal').style.display = 'block';
                document.getElementById('menu').classList.add('escondido');
                document.getElementById('telaCompartilhar').classList.remove('escondido');
                
                socket.emit('criar-sala');
            } catch (err) {
                alert("Você cancelou a captura de tela.");
            }
        }

        socket.on('sala-criada', (codigo) => {
            codigoAtual = codigo;
            document.getElementById('codigoSala').innerText = codigo;
            document.getElementById('codigoSala').style.display = 'block';
        });

        socket.on('novo-espectador', async () => {
            peerConnection = new RTCPeerConnection(configuracao);
            
            // Adiciona o vídeo
            streamLocal.getTracks().forEach(track => peerConnection.addTrack(track, streamLocal));

            // ESSA PARTE É A CHAVE PARA O VÍDEO APARECER:
            peerConnection.onicecandidate = event => {
                if (event.candidate) {
                    socket.emit('sinal', { sala: codigoAtual, sinal: { type: 'candidate', candidate: event.candidate } });
                }
            };

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('sinal', { sala: codigoAtual, sinal: offer });
        });

        // --- QUEM ASSISTE ---
        async function assistirTela() {
            const codigo = document.getElementById('inputCodigo').value.toUpperCase();
            if(codigo.length !== 4) return alert("Digite o código de 4 dígitos.");
            codigoAtual = codigo;

            document.getElementById('menu').classList.add('escondido');
            document.getElementById('telaAssistir').classList.remove('escondido');

            peerConnection = new RTCPeerConnection(configuracao);

            // Quando o vídeo chegar, coloca na tela
            peerConnection.ontrack = (event) => {
                document.getElementById('videoRemoto').srcObject = event.streams[0];
                document.getElementById('videoRemoto').style.display = 'block';
            };

            // ESSA PARTE É A CHAVE PARA O VÍDEO APARECER:
            peerConnection.onicecandidate = event => {
                if (event.candidate) {
                    socket.emit('sinal', { sala: codigoAtual, sinal: { type: 'candidate', candidate: event.candidate } });
                }
            };

            socket.emit('entrar-sala', codigo);
        }

        // --- TROCA DE MENSAGENS ENTRE OS DOIS (SDP e ICE) ---
        socket.on('sinal', async (sinal) => {
            if (!peerConnection) return;

            if (sinal.type === 'offer') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(sinal));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                socket.emit('sinal', { sala: codigoAtual, sinal: answer });
            } 
            else if (sinal.type === 'answer') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(sinal));
            } 
            else if (sinal.type === 'candidate') {
                await peerConnection.addIceCandidate(new RTCIceCandidate(sinal.candidate));
            }
        });
    </script>
</body>
</html>
